<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu mesa — Casa Turquesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', Arial, sans-serif;
    background: #efe9df; color: #2b2420; min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .phone {
    max-width: 430px; width: 100%; min-height: 100vh;
    background: #fbf9f5; box-shadow: 0 0 60px rgba(0,0,0,0.08);
    position: relative;
  }
  .hero {
    height: 260px; position: relative; overflow: hidden;
    background:
      linear-gradient(180deg, rgba(20,14,10,0.15) 0%, rgba(20,14,10,0.75) 100%),
      radial-gradient(120% 100% at 20% 0%, #6b4a30 0%, #3a2717 55%, #1c130c 100%);
  }
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .hero-text {
    position: absolute; left: 28px; bottom: 24px; z-index: 2; color: #fff;
  }
  .hero-eyebrow {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    opacity: 0.75; margin: 0 0 6px;
  }
  .hero-title {
    font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 600;
    margin: 0; line-height: 1.05;
  }

  .content { padding: 26px 26px 40px; }
  .section-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #a9926f; font-weight: 600; margin: 0 0 4px;
  }
  h2.title {
    font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600;
    margin: 0 0 4px; color: #2b2013;
  }
  p.sub { margin: 0 0 26px; color: #8a7a68; font-size: 13.5px; }

  label {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; margin: 18px 0 7px; color: #7a6a56;
  }
  input {
    width: 100%; padding: 12px 4px; border: none; border-bottom: 1.5px solid #dcd0bd;
    border-radius: 0; font-size: 16px; background: transparent; font-family: 'Inter', sans-serif;
    color: #2b2420;
  }
  input::placeholder { color: #b8ab97; }
  input:focus { outline: none; border-bottom-color: #2b2013; }
  input[type="date"], input[type="time"] { color: #2b2420; }

  .row { display: flex; gap: 18px; }
  .row > div { flex: 1; }

  button {
    width: 100%; margin-top: 30px; padding: 15px; border: none; border-radius: 999px;
    background: #201811; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    letter-spacing: 0.3px; font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { margin-top: 16px; font-size: 13.5px; text-align: center; }
  .msg.err { color: #b3352b; }

  .success { text-align: center; padding: 60px 8px 20px; }
  .success .icon {
    width: 64px; height: 64px; border-radius: 50%; background: #201811; color: #fff;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;
    font-size: 28px;
  }
  .success h2 { margin-bottom: 6px; }
  .success .code-box {
    margin-top: 24px; padding: 18px; border: 1.5px dashed #dcd0bd; border-radius: 14px;
  }
  .success .code-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #a9926f; margin: 0 0 6px; }
  .success .code {
    font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600;
    color: #201811; letter-spacing: 1px; margin: 0;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="hero">
      <div class="hero-text">
        <p class="hero-eyebrow">Casa Turquesa · Ñuñoa</p>
        <p class="hero-title">Reserva<br>tu mesa</p>
      </div>
    </div>

    <div class="content" id="card">
      <p class="section-label">Nueva reserva</p>
      <h2 class="title">Reservation</h2>
      <p class="sub">Completa tus datos y te esperamos en Ortuzar 250</p>

      <form id="form">
        <label>Nombre completo</label>
        <input type="text" id="nombre" required>

        <label>RUT</label>
        <input type="text" id="rut" placeholder="12.345.678-9" required>

        <div class="row">
          <div>
            <label>Teléfono</label>
            <input type="tel" id="telefono" placeholder="+56 9 1234 5678" required>
          </div>
          <div>
            <label>Personas</label>
            <input type="number" id="personas" min="1" max="100" required>
          </div>
        </div>

        <label>Correo electrónico</label>
        <input type="email" id="correo" required>

        <div class="row">
          <div>
            <label>Fecha</label>
            <input type="date" id="fecha" required>
          </div>
          <div>
            <label>Hora</label>
            <input type="time" id="hora" required>
          </div>
        </div>

        <label>Comentario (opcional)</label>
        <input type="text" id="nota" placeholder="Alergias, mascota, etc.">

        <button type="submit" id="btn">Confirmar reserva</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://udsvumfwczyormmprizm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkc3Z1bWZ3Y3p5b3JtbXByaXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTg1MzgsImV4cCI6MjA5NTM5NDUzOH0.h3MzXhUrIkwssCCwWSohg9l40weroZUP81NJ3PLIAxE';

function generarCodigo() {
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let c = '';
  for (let i = 0; i < 6; i++) c += letras[Math.floor(Math.random() * letras.length)];
  return 'Coffee-' + c;
}

const params = new URLSearchParams(window.location.search);
const plataformaOrigen = params.get('origen') === 'whatsapp' ? 'WhatsApp' : 'Instagram';

document.getElementById('form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  msg.textContent = '';
  msg.className = 'msg';

  const idReserva = generarCodigo();
  const body = {
    id_reserva: idReserva,
    nombre_contacto: document.getElementById('nombre').value.trim(),
    rut: document.getElementById('rut').value.trim(),
    whatsapp_contacto: document.getElementById('telefono').value.trim(),
    correo: document.getElementById('correo').value.trim().toLowerCase(),
    personas: parseInt(document.getElementById('personas').value, 10),
    fecha: document.getElementById('fecha').value,
    hora: document.getElementById('hora').value,
    nota: document.getElementById('nota').value.trim(),
    plataforma: plataformaOrigen,
    estado: 'activa'
  };

  try {
    const resp = await fetch(SUPABASE_URL + '/rest/v1/reservas', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    document.getElementById('card').innerHTML = `
      <div class="success">
        <div class="icon">&#10003;</div>
        <h2 class="title">Reserva confirmada</h2>
        <p class="sub">Te esperamos en Casa Turquesa</p>
        <div class="code-box">
          <p class="code-label">Código de seguimiento</p>
          <p class="code">${idReserva}</p>
        </div>
        <p class="sub" style="margin-top:18px;">Guarda este código por si necesitas cancelar o modificar tu reserva.</p>
      </div>`;
  } catch (err) {
    msg.textContent = 'Hubo un problema al confirmar tu reserva. Intenta de nuevo o escríbenos al WhatsApp +56 9 3499 0617.';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'Confirmar reserva';
  }
});

const hoy = new Date().toISOString().split('T')[0];
document.getElementById('fecha').min = hoy;
</script>
</body>
</html>
