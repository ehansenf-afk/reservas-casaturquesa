<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu mesa — Casa Turquesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', Arial, sans-serif;
    background: #efe9df; color: #2b2420; min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .phone {
    max-width: 430px; width: 100%; min-height: 100vh;
    background: #fbf9f5; box-shadow: 0 0 60px rgba(0,0,0,0.08);
    position: relative;
  }
  .hero {
    height: 260px; position: relative; overflow: hidden;
    background:
      linear-gradient(180deg, rgba(0,20,20,0.10) 0%, rgba(0,16,18,0.80) 100%),
      radial-gradient(120% 100% at 15% 0%, #10cfc9 0%, #007a8a 55%, #003d42 100%);
  }
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  .hero-text {
    position: absolute; left: 28px; bottom: 24px; z-index: 2; color: #fff;
  }
  .hero-eyebrow {
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    opacity: 0.75; margin: 0 0 6px;
  }
  .hero-title {
    font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 600;
    margin: 0; line-height: 1.05;
  }
  .hero-logo {
    position: absolute; top: 24px; left: 28px; z-index: 2;
    width: 76px; height: 76px; border-radius: 50%;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }

  .content { padding: 26px 26px 40px; }
  .section-label {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: #10a89f; font-weight: 600; margin: 0 0 4px;
  }
  h2.title {
    font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 600;
    margin: 0 0 4px; color: #2b2013;
  }
  p.sub { margin: 0 0 26px; color: #8a7a68; font-size: 13.5px; }

  label {
    display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; margin: 18px 0 7px; color: #7a6a56;
  }
  input {
    width: 100%; padding: 12px 4px; border: none; border-bottom: 1.5px solid #dcd0bd;
    border-radius: 0; font-size: 16px; background: transparent; font-family: 'Inter', sans-serif;
    color: #2b2420;
  }
  input::placeholder { color: #b8ab97; }
  input:focus { outline: none; border-bottom-color: #007a8a; }

  .row { display: flex; gap: 18px; }
  .row > div { flex: 1; }

  .phone-row { display: flex; gap: 10px; align-items: flex-end; }
  .phone-row .cod { flex: 0 0 92px; }
  .phone-row .num { flex: 1; }
  select#cod_pais {
    width: 100%; padding: 12px 4px; border: none; border-bottom: 1.5px solid #dcd0bd;
    font-size: 16px; background: transparent; font-family: 'Inter', sans-serif; color: #2b2420;
    appearance: none; -webkit-appearance: none;
  }
  select#cod_pais:focus { outline: none; border-bottom-color: #007a8a; }

  button {
    width: 100%; margin-top: 30px; padding: 15px; border: none; border-radius: 999px;
    background: #003d42; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    letter-spacing: 0.3px; font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { margin-top: 16px; font-size: 13.5px; text-align: center; }
  .msg.err { color: #b3352b; }

  .success { text-align: center; padding: 60px 8px 20px; }
  .success .icon {
    width: 64px; height: 64px; border-radius: 50%; background: #007a8a; color: #fff;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;
    font-size: 28px;
  }
  .success h2 { margin-bottom: 6px; }
  .success .code-box {
    margin-top: 24px; padding: 18px; border: 1.5px dashed #bfe4e2; border-radius: 14px;
    background: #f2fbfa;
  }
  .success .code-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #10a89f; margin: 0 0 6px; }
  .success .code {
    font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600;
    color: #003d42; letter-spacing: 1px; margin: 0;
  }

  /* Calendario visual */
  .cal-box { margin-top: 18px; border: 1px solid #e6ded1; border-radius: 14px; padding: 16px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-month { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: #2b2013; text-transform: capitalize; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    all: unset; width: 26px; height: 26px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; cursor: pointer; color: #007a8a;
    font-size: 14px; background: #f2fbfa; margin: 0;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-dow { font-size: 10px; color: #a9926f; text-transform: uppercase; padding: 4px 0 8px; }
  .cal-day {
    all: unset; box-sizing: border-box; width: 100%; aspect-ratio: 1; display: flex;
    align-items: center; justify-content: center; border-radius: 50%; font-size: 13px;
    color: #2b2420; cursor: pointer;
  }
  .cal-day.disabled { color: #d8cfc2; cursor: default; }
  .cal-day.selected { background: #007a8a; color: #fff; font-weight: 600; }
  .cal-day.empty { visibility: hidden; }

  .time-box { margin-top: 4px; }
  .time-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; -webkit-overflow-scrolling: touch; }
  .time-chip {
    all: unset; box-sizing: border-box; flex: 0 0 auto; padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid #dcd0bd; font-size: 13px; color: #2b2420; cursor: pointer; white-space: nowrap;
  }
  .time-chip.selected { background: #007a8a; border-color: #007a8a; color: #fff; font-weight: 600; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://udsvumfwczyormmprizm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkc3Z1bWZ3Y3p5b3JtbXByaXptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTg1MzgsImV4cCI6MjA5NTM5NDUzOH0.h3MzXhUrIkwssCCwWSohg9l40weroZUP81NJ3PLIAxE';

function generarCodigo() {
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let c = '';
  for (let i = 0; i < 6; i++) c += letras[Math.floor(Math.random() * letras.length)];
  return 'Coffee-' + c;
}

const params = new URLSearchParams(window.location.search);
const plataformaOrigen = params.get('origen') === 'whatsapp' ? 'WhatsApp' : 'Instagram';

// Auto-formato de RUT: el cliente solo escribe números (y opcionalmente la k final), nosotros ponemos puntos y guion.
function formatearRut(valor) {
  let limpio = valor.replace(/[^0-9kK]/g, '').toUpperCase();
  if (limpio.length === 0) return '';
  let dv = limpio.slice(-1);
  let cuerpo = limpio.slice(0, -1);
  if (cuerpo.length === 0) return dv;
  let cuerpoFormateado = '';
  for (let i = 0; i < cuerpo.length; i++) {
    const posDesdeElFinal = cuerpo.length - i;
    cuerpoFormateado += cuerpo[i];
    if (posDesdeElFinal > 1 && posDesdeElFinal % 3 === 1) cuerpoFormateado += '.';
  }
  return cuerpoFormateado + '-' + dv;
}
const rutInput = document.getElementById('rut');
rutInput.addEventListener('input', function() {
  const cursorAlFinal = this.selectionStart === this.value.length;
  this.value = formatearRut(this.value);
  if (cursorAlFinal) this.setSelectionRange(this.value.length, this.value.length);
});

// El teléfono solo acepta dígitos (el código de país va aparte, en el select).
document.getElementById('telefono').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '');
});

document.getElementById('form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  msg.textContent = '';
  msg.className = 'msg';

  const idReserva = generarCodigo();
  const body = {
    id_reserva: idReserva,
    nombre_contacto: document.getElementById('nombre').value.trim(),
    rut: document.getElementById('rut').value.trim(),
    whatsapp_contacto: document.getElementById('cod_pais').value + document.getElementById('telefono').value.trim(),
    correo: document.getElementById('correo').value.trim().toLowerCase(),
    personas: parseInt(document.getElementById('personas').value, 10),
    fecha: document.getElementById('fecha').value,
    hora: document.getElementById('hora').value,
    nota: document.getElementById('nota').value.trim(),
    plataforma: plataformaOrigen,
    estado: 'activa'
  };

  try {
    const resp = await fetch(SUPABASE_URL + '/rest/v1/reservas', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(body)
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    document.getElementById('card').innerHTML = `
      <div class="success">
        <div class="icon">&#10003;</div>
        <h2 class="title">Reserva confirmada</h2>
        <p class="sub">Te esperamos en Casa Turquesa</p>
        <div class="code-box">
          <p class="code-label">Código de seguimiento</p>
          <p class="code">${idReserva}</p>
        </div>
        <p class="sub" style="margin-top:18px;">Guarda este código por si necesitas cancelar o modificar tu reserva.</p>
      </div>`;
  } catch (err) {
    msg.textContent = 'Hubo un problema al confirmar tu reserva. Intenta de nuevo o escríbenos al WhatsApp +56 9 3499 0617.';
    msg.className = 'msg err';
    btn.disabled = false;
    btn.textContent = 'Confirmar reserva';
  }
});

// --- Calendario visual ---
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW = ['L','M','M','J','V','S','D'];
const hoyDate = new Date();
hoyDate.setHours(0,0,0,0);
let calAno = hoyDate.getFullYear();
let calMesIdx = hoyDate.getMonth();
let fechaSeleccionada = null;

function renderCalendario() {
  document.getElementById('calMes').textContent = MESES[calMesIdx] + ' ' + calAno;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  DOW.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  const primerDia = new Date(calAno, calMesIdx, 1);
  let offset = primerDia.getDay() - 1; // lunes = 0
  if (offset < 0) offset = 6;
  for (let i = 0; i < offset; i++) {
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }
  const diasEnMes = new Date(calAno, calMesIdx + 1, 0).getDate();
  for (let dia = 1; dia <= diasEnMes; dia++) {
    const fechaISO = calAno + '-' + String(calMesIdx + 1).padStart(2,'0') + '-' + String(dia).padStart(2,'0');
    const fechaObj = new Date(calAno, calMesIdx, dia);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-day';
    btn.textContent = dia;
    if (fechaObj < hoyDate) {
      btn.classList.add('disabled');
      btn.disabled = true;
    } else {
      btn.addEventListener('click', () => {
        fechaSeleccionada = fechaISO;
        document.getElementById('fecha').value = fechaISO;
        renderCalendario();
      });
    }
    if (fechaISO === fechaSeleccionada) btn.classList.add('selected');
    grid.appendChild(btn);
  }
}
document.getElementById('calPrev').addEventListener('click', () => {
  calMesIdx--;
  if (calMesIdx < 0) { calMesIdx = 11; calAno--; }
  renderCalendario();
});
document.getElementById('calNext').addEventListener('click', () => {
  calMesIdx++;
  if (calMesIdx > 11) { calMesIdx = 0; calAno++; }
  renderCalendario();
});
renderCalendario();

// --- Chips de hora (horario del local: L-V 7:30-21:00, Sáb-Dom-Festivos 9:00-21:00) ---
const HORAS = [];
for (let h = 8; h <= 20; h++) {
  HORAS.push(String(h).padStart(2,'0') + ':00');
  if (h < 20) HORAS.push(String(h).padStart(2,'0') + ':30');
}
const timeScroll = document.getElementById('timeScroll');
HORAS.forEach(hora => {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'time-chip';
  chip.textContent = hora;
  chip.addEventListener('click', () => {
    document.getElementById('hora').value = hora;
    document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('selected'));
    chip.classList.add('selected');
  });
  timeScroll.appendChild(chip);
});
</script>
</body>
